name: gameday-refresh

# Extra refreshes close to kickoff: injury reports, depth charts and line moves land in the
# projections before you build. Times are UTC (ET + 4 in September/October, +5 after Nov 1).
on:
  schedule:
    - cron: "30 22 * * 4"     # Thu 6:30 PM ET
    - cron: "30 22 * * 6"     # Sat 6:30 PM ET — final injury designations
    - cron: "0 11 * * 0"      # Sun 7:00 AM ET  (+ sportsbook player props, once a week: ~84 Odds API credits; the 9:30 lineup task uses them)
    - cron: "0 14 * * 0"      # Sun 10:00 AM ET
    - cron: "45 15 * * 0"     # Sun 11:45 AM ET — last look before 1 PM lock
  workflow_dispatch:
    inputs:
      props:
        description: "also fetch sportsbook player props (costs ~84 Odds API credits)"
        required: false
        default: "false"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r jobs/requirements.txt
      - name: Run log (start)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python jobs/runlog.py --task gameday-refresh --status started
      - name: Refresh data + re-sim
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python jobs/ingest.py || { echo "ingest failed - continuing with the last good data"; echo ingest >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/inactives.py || { echo "inactives skipped"; echo inactives >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/fetch_dk_salaries.py --import || { echo "dk salaries skipped"; echo fetch_dk_salaries >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/odds.py || { echo "odds skipped"; echo odds >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/weather.py || { echo "weather skipped"; echo weather >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/props.py --source kalshi || { echo "kalshi props skipped"; echo props >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/project.py --latest || { echo "no slate"; echo project >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/simulate.py --latest || { echo "no slate"; echo simulate >> "$RUNNER_TEMP/failed_steps"; }
          python jobs/edges.py --out web/data/edges.json || { echo "edges skipped"; echo edges >> "$RUNNER_TEMP/failed_steps"; }
      - name: Sportsbook player props merged with Kalshi (Sunday 7 AM ET, or on request)
        if: ${{ always() && (github.event.schedule == '0 11 * * 0' || github.event.inputs.props == 'true') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          # Supabase pg_cron (supabase/pending/014_cron_dispatch.sql) dispatches this run on time; GitHub's own
          # schedule is only a backup and is often hours late. Never pay for sportsbook props twice in a morning:
          # skip if >= 150 sportsbook-sourced rows for the latest slate were written in the last 3 hours.
          if python - <<'PY'
          import json, os, sys, urllib.request, datetime as dt
          U, K = os.environ["SUPABASE_URL"], os.environ["SUPABASE_SERVICE_ROLE_KEY"]
          h = {"apikey": K}
          get = lambda q: json.load(urllib.request.urlopen(urllib.request.Request(f"{U}/rest/v1/{q}", headers=h)))
          slate = get("slates?select=slate_id&order=imported_at.desc&limit=1")[0]["slate_id"]
          since = (dt.datetime.now(dt.timezone.utc) - dt.timedelta(hours=3)).strftime("%Y-%m-%dT%H:%M:%SZ")
          rows = get(f"slate_projections?select=components&slate_id=eq.{slate}&method=eq.props&updated_at=gte.{since}")
          n = sum("odds" in ((r.get("components") or {}).get("src") or []) for r in rows)
          print(f"sportsbook props written in the last 3 h: {n}")
          sys.exit(0 if n >= 150 else 1)
          PY
          then echo "fresh sportsbook props already landed - skipping the paid pull"
          else python jobs/props.py --source both --force || { echo "props skipped"; echo props >> "$RUNNER_TEMP/failed_steps"; }; fi
          # re-screen with the sportsbook lines behind the model (rows flip from sim-only to book-backed)
          python jobs/edges.py --out web/data/edges.json || { echo "edges skipped"; echo edges >> "$RUNNER_TEMP/failed_steps"; }
      - name: Pre-lock checklist (Sunday 7 AM run) — fails this job loudly if the 9:30 build's inputs are missing
        if: ${{ always() && (github.event.schedule == '0 11 * * 0' || github.event.inputs.props == 'true') }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$(TZ=America/New_York date +%u)" != "7" ]; then echo "not Sunday - checklist skipped"; exit 0; fi
          python jobs/preflight.py --mode sun --skip news --skip tasks --log preflight-7am
      - name: Publish the edge screen (web/data/edges.json, same path backtest.yml uses for backtest.json)
        if: ${{ always() }}
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/edges.json
          if git diff --cached --quiet; then echo "edges.json unchanged"; exit 0; fi
          git commit -m "edges: $(python -c 'import json;d=json.load(open("web/data/edges.json"));print(d["slate"], len(d["rows"]), "sides")')"
          git pull --rebase --autostash || true
          git push || { echo "edges push failed - the file is still in the run"; echo edges-publish >> "$RUNNER_TEMP/failed_steps"; }
      - name: Run log (finish)
        if: ${{ always() }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          FAILED=$(sort -u "$RUNNER_TEMP/failed_steps" 2>/dev/null | tr '\n' ' ' | sed 's/ *$//')
          WHY="$GITHUB_EVENT_NAME${{ github.event.schedule && format(' {0}', github.event.schedule) || '' }}"
          if [ "${{ job.status }}" != "success" ]; then S=failed; M="job ${{ job.status }}${FAILED:+ - soft-failed: $FAILED}"
          elif [ -n "$FAILED" ]; then S=warn; M="soft-failed: $FAILED"
          else S=ok; M="all steps ok"; fi
          python jobs/runlog.py --task gameday-refresh --status $S --summary "$M ($WHY)"
