<script>
(async function () {
  const GS = window.GS, cfg = GS.cfg, plan = cfg.PLAN || {};
  document.getElementById("brand").innerHTML = GS.BRAND;
  document.getElementById("price").textContent = `${plan.price || "$99"} a ${plan.interval || "month"}. Cancel any time.`;
  document.getElementById("foot").innerHTML = GS.FOOT_LINKS + `<div class="legal">${GS.LEGAL}</div>`;
  // someone who is already logged in goes straight to the tools (or to the payment step if they never finished signing up)
  await GS.Account.ready;
  const A = GS.Account;
  if (!A.user) return;
  if (A.active()) { location.replace("home.html"); return; }
  document.getElementById("cta").innerHTML = `<a class="btn btn-primary btn-lg" href="signup.html?step=pay">Finish signing up</a>`;
  document.getElementById("topLogin").outerHTML = `<button class="btn btn-sm" type="button" data-logout>Log out</button>`;
  document.addEventListener("click", (e) => { if (e.target.closest("[data-logout]")) A.logout(); });
})();
</script>
