[build]
  publish = "web"

# Stripe checkout, billing portal and webhook (no npm packages; see billing/README.md)
[functions]
  directory = "billing/functions"

# the old pricing page is gone: the price is on the sign-up page
[[redirects]]
  from = "/pricing.html"
  to = "/signup.html"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    # always revalidate: a deploy changes the HTML, CSS and JS together, and a browser holding a 5-minute-old
    # stylesheet against new HTML showed the page unstyled (10/1). ETags make the re-check a cheap 304.
    Cache-Control = "public, max-age=0, must-revalidate"
