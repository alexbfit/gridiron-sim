<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("gs_theme")||"light";if(localStorage.getItem("gs_owner")==="1")document.documentElement.classList.add("owner")}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ui.css">
<title>Account · GameTime Win</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/shell.js"></script>
</head>
<body>
<header data-shell-header></header>
<main class="page">
  <div class="page-head"><div><h1>Account</h1><p id="who">&nbsp;</p></div></div>
  <div class="acct" id="acct"><div class="skeleton" style="height:22px;width:50%"></div></div>
</main>
<footer data-shell-footer="app"></footer>
<script>
(async function () {
  const GS = window.GS, cfg = GS.cfg, A = GS.Account, plan = cfg.PLAN || {}, box = document.getElementById("acct");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  await A.ready;
  if (!A.user) return;                                   // the shell is already sending them to log in

  // Arriving straight from a log-in (Google or an emailed link): carry on to where they were headed.
  let after = null;
  try { after = JSON.parse(GS.store.get("gs_after_auth") || "null"); } catch (e) {}
  if (after && Date.now() - (after.at || 0) < 30 * 60 * 1000) {
    GS.store.set("gs_after_auth", null);
    if (!A.active()) { location.replace("signup.html?step=pay"); return; }
    location.replace(GS.MEMBER_PAGES.has(after.next) ? after.next : "home.html"); return;
  }
  GS.store.set("gs_after_auth", null);

  const p = A.profile || {}, status = p.subscription_status || "none";
  const date = p.current_period_end ? new Date(p.current_period_end).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" }) : null;
  const price = `${plan.price || "$99"} a ${plan.interval || "month"}`;
  let title, line, action = "";
  if (A.owner()) { title = "Owner access"; line = "Everything is open. No membership needed."; }
  else if (A.subscribed() && p.cancel_at_period_end) { title = "Membership ending"; line = `You keep access until ${date || "the end of this billing month"}. It will not renew.`; action = `<button class="btn" id="portal">Manage billing</button>`; }
  else if (A.subscribed()) { title = "Membership active"; line = `${price}.${date ? ` Renews ${date}.` : ""}`; action = `<button class="btn" id="portal">Manage billing</button>`; }
  else if (status === "past_due" || status === "unpaid") { title = "Payment failed"; line = "Your last payment didn't go through. Update your card to keep access."; action = `<button class="btn btn-primary" id="portal">Update payment details</button>`; }
  else if (!A.gating()) { title = "Access open"; line = "Memberships aren't required right now."; }
  else { title = "No membership"; line = `The tools need a membership: ${price}.`; action = `<a class="btn btn-primary" href="signup.html?step=pay">Start membership</a>`; }

  document.getElementById("who").textContent = A.user.email;
  const manage = action.includes('id="portal"');
  box.innerHTML = `
    <div class="acct-row"><div><h3>${esc(title)}</h3><p>${esc(line)}${manage && A.subscribed() ? " Change your card, download invoices or cancel under Manage billing. If you cancel, you keep access until the end of the month you paid for." : ""}</p></div>${action}</div>
    <div class="acct-row"><div><h3>Appearance</h3><p>Light is easier in daylight. Dark is easier at night.</p></div>
      <div class="seg" id="themeSeg" style="width:180px"><button type="button" data-t="light">Light</button><button type="button" data-t="dark">Dark</button></div></div>
    <div class="acct-row"><div><h3>Log out</h3><p>On this device only.</p></div><button class="btn" type="button" data-logout>Log out</button></div>`;
  const paint = () => box.querySelectorAll("#themeSeg button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === document.documentElement.dataset.theme)));
  paint();
  document.getElementById("themeSeg").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; document.documentElement.dataset.theme = b.dataset.t; GS.store.set("gs_theme", b.dataset.t); paint(); });
  box.querySelectorAll("#portal").forEach(btn => btn.addEventListener("click", async () => {
    const label = btn.textContent; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Opening`;
    try { await A.portal(); } catch (err) { GS.toast(err.message, "error"); btn.disabled = false; btn.textContent = label; }
  }));
})();
</script>
</body>
</html>
