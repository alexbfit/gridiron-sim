name: backtest

# Replays past weeks and publishes web/data/backtest.json (Netlify redeploys the report page).

on:
  workflow_dispatch:
    inputs:
      season:
        description: "Season to replay"
        default: "2025"
      weeks:
        description: "Week range, e.g. 5-18"
        default: "5-18"
      sims:
        description: "Sims per week"
        default: "3000"

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r jobs/requirements.txt
      - name: Run backtest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          cd jobs && python backtest.py --season ${{ github.event.inputs.season }} --weeks ${{ github.event.inputs.weeks }} \
            --sims ${{ github.event.inputs.sims }} --out ../web/data/backtest.json
      - name: Commit results
        run: |
          git config user.name "gridiron-bot"
          git config user.email "actions@users.noreply.github.com"
          git add web/data/backtest.json
          git diff --cached --quiet || git commit -m "backtest: ${{ github.event.inputs.season }} wk ${{ github.event.inputs.weeks }}"
          git push
