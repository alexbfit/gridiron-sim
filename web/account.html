<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("gs_theme")||"dark";if(localStorage.getItem("gs_owner")==="1")document.documentElement.classList.add("owner")}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Inter+Tight:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ui.css">
<link rel="stylesheet" href="assets/site.css">
<title>Account · GameTime Win</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/shell.js"></script>
<script src="assets/plans.js"></script>
</head>
<body>
<header data-shell-header="app"></header>
<main class="page">
  <div class="card auth-card" id="acct">
    <div class="skeleton" style="height:28px;width:60%"></div>
    <div class="skeleton" style="height:14px;width:90%;margin-top:14px"></div>
  </div>
</main>
<footer data-shell-footer="site"></footer>
<script>
(async function () {
  const cfg = window.GRIDIRON_CONFIG || {}, GS = window.GS, box = document.getElementById("acct");
  const PLANS = cfg.PLANS || {}, GP = window.GTW_PLANS;
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  if (!cfg.AUTH_ENABLED) {
    box.innerHTML = `<div class="empty" style="padding:6px 0 0"><div class="icon-wrap">${GS.icon("user")}</div>
      <h1>Accounts are coming soon</h1>
      <p style="margin-top:6px">GameTime Win is free while it's in beta — no sign-up needed. Your locks, edits and settings are saved in this browser automatically.</p></div>
      <a class="btn btn-primary btn-block" style="margin-top:22px" href="lineups.html">Open the lineup builder</a>
      <a class="btn btn-ghost btn-block" style="margin-top:8px" href="pricing.html">See pricing plans</a>`;
    return;
  }

  const supa = GS.Account.getClient();
  await GS.Account.ready;
  const user = GS.Account.user, profile = GS.Account.profile;
  const qs = new URLSearchParams(location.search);
  if (qs.get("checkout") === "success") GS.toast("Thanks for subscribing! It can take a few seconds for your plan to show.", "ok");
  if (qs.get("checkout") === "cancel") GS.toast("Checkout canceled — you weren't charged.");

  if (!user) {
    box.innerHTML = `<h1>Sign in</h1>
      <p class="muted">We'll email you a one-time sign-in link — no password needed. New here? The same link creates your account.</p>
      <form id="signin" style="margin-top:20px;display:grid;gap:12px">
        <label class="field"><span>Email</span><input class="input" type="email" id="email" required autocomplete="email" placeholder="you@example.com"></label>
        <button class="btn btn-primary btn-block" type="submit" id="sendBtn">Email me a sign-in link</button>
      </form>
      <p class="hint" style="margin-top:14px">By continuing you agree to use GameTime Win for research only. Must be of legal age to play paid contests in your state.</p>`;
    document.getElementById("signin").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("sendBtn"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Sending…`;
      const { error } = await supa.auth.signInWithOtp({ email: document.getElementById("email").value.trim(), options: { emailRedirectTo: location.origin + "/account.html" } });
      if (error) { GS.toast(error.message, "error"); btn.disabled = false; btn.textContent = "Email me a sign-in link"; return; }
      box.innerHTML = `<div class="empty" style="padding:6px 0"><div class="icon-wrap">${GS.icon("check")}</div><h1>Check your email</h1><p style="margin-top:6px">We sent a sign-in link to <b>${esc(document.getElementById("email")?.value || "your inbox")}</b>. Open it on this device to finish signing in.</p></div>`;
    });
    return;
  }

  const status = profile?.subscription_status || "none";
  const subscribed = status === "active" || status === "trialing";
  const slateUntil = profile?.slate_pass_until ? new Date(profile.slate_pass_until) : null;
  const slateActive = !!slateUntil && slateUntil.getTime() > Date.now();
  const active = subscribed || slateActive || !!profile?.is_owner;
  const planKey = profile?.is_owner ? "pro" : subscribed ? (PLANS[profile?.plan] ? profile.plan : "starter") : slateActive ? "slate" : "free";
  const planName = profile?.is_owner ? "Owner" : (PLANS[planKey]?.name || "Free");
  const fmtDate = (d) => d.toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
  const fmtTime = (d) => d.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  const until = profile?.current_period_end ? fmtDate(new Date(profile.current_period_end)) : null;
  let line = "";
  if (profile?.is_owner) line = "Full access.";
  else if (subscribed) line = until ? `${profile.cancel_at_period_end ? "Ends" : "Renews"} ${until}` : "";
  else if (slateActive) line = `Slate Pass · Starter features until ${fmtDate(slateUntil)} at ${fmtTime(slateUntil)}`;
  else line = cfg.BILLING_LIVE ? `Simple Mode with ${cfg.FREE_LINEUPS || 3} lineups per slate. Upgrade for more.` : "Paid plans aren't open yet — everything is free in the beta.";

  const upgradeCards = cfg.BILLING_LIVE && !subscribed && !profile?.is_owner && GP
    ? `<div class="acct-plans">
        ${["starter", "pro"].filter(k => PLANS[k]).map(k => { const P = PLANS[k]; return `<div class="tile${P.featured ? " accent" : ""}">
          <div class="k">${esc(P.name)}${P.featured ? ' · <span style="color:var(--accent)">most popular</span>' : ""}</div>
          <div class="v" style="font-size:20px">${esc(P.price?.monthly || "")}<small class="muted" style="font-size:12px;font-weight:500"> /mo</small> <span class="muted" style="font-size:13px;font-weight:500">or ${esc(P.price?.season || "")} season</span></div>
          <div class="s">${esc(P.tagline || "")}</div>
          <div style="display:grid;gap:6px;margin-top:10px">
            <button type="button" class="btn btn-sm${P.featured ? " btn-primary" : ""}" data-checkout-plan="${k}" data-checkout-interval="monthly">Start ${P.trialDays || 7}-day trial · monthly</button>
            <button type="button" class="btn btn-sm btn-ghost" data-checkout-plan="${k}" data-checkout-interval="season">Season pass ${esc(P.price?.season || "")}</button>
          </div></div>`; }).join("")}
        ${PLANS.slate && !slateActive ? `<div class="tile"><div class="k">${esc(PLANS.slate.name)}</div><div class="v" style="font-size:20px">${esc(PLANS.slate.price?.once || "")}<small class="muted" style="font-size:12px;font-weight:500"> once</small></div><div class="s">${esc(PLANS.slate.tagline || "")}</div>
          <div style="margin-top:10px"><button type="button" class="btn btn-sm btn-block" data-checkout-plan="slate" data-checkout-interval="once">Buy a Slate Pass</button></div></div>` : ""}
       </div>
       <p class="hint" style="margin-top:10px">${esc(cfg.PRICING_NOTES?.trial || "")} ${esc(cfg.PRICING_NOTES?.refunds || "")} <a class="link" href="pricing.html">Compare plans</a>.</p>`
    : "";

  box.innerHTML = `<h1>Your account</h1>
    <p class="muted">${esc(user.email)}</p>
    <div class="tile" style="margin-top:20px">
      <div class="k">Plan</div>
      <div class="v" style="font-size:20px">${esc(planName)} ${subscribed ? `<span class="badge ok" style="vertical-align:4px">${status === "trialing" ? "Trial" : "Active"}</span>` : slateActive ? `<span class="badge ok" style="vertical-align:4px">Slate Pass</span>` : ""}</div>
      <div class="s">${line}</div>
    </div>
    ${upgradeCards}
    <div style="display:grid;gap:8px;margin-top:18px">
      ${active ? `<a class="btn btn-primary btn-block" href="lineups.html">Open the lineup builder</a>` : `<a class="btn btn-primary btn-block" href="simple.html">Open Simple Mode</a>`}
      ${profile?.stripe_customer_id ? `<button class="btn btn-block" id="portal">Manage billing</button>` : ""}
      <button class="btn btn-ghost btn-block" id="signout">${GS.icon("logout")} Sign out</button>
    </div>`;
  const call = async (fn) => {
    const { data } = await supa.auth.getSession();
    const res = await fetch(`/.netlify/functions/${fn}`, { method: "POST", headers: { Authorization: "Bearer " + data.session.access_token } });
    const j = await res.json().catch(() => ({}));
    if (!res.ok || !j.url) throw new Error(j.error || "Billing is not set up yet.");
    location.href = j.url;
  };
  if (GP) GP.wireCheckout(box);
  document.getElementById("portal")?.addEventListener("click", (e) => { e.target.disabled = true; call("billing-portal").catch(err => { GS.toast(err.message, "error"); e.target.disabled = false; }); });
  // arrived from pricing.html with a plan picked (before or after the magic link): continue straight to checkout
  const intent = GP?.intent();
  if (intent && cfg.BILLING_LIVE && !subscribed && !profile?.is_owner && PLANS[intent.plan] && intent.plan !== "free") {
    GS.toast(`Taking you to checkout for ${PLANS[intent.plan].name}…`);
    GP.checkout(intent.plan, intent.interval).catch(err => GS.toast(err.message, "error"));
  }
  document.getElementById("signout").addEventListener("click", async () => { await supa.auth.signOut(); location.href = "index.html"; });
})();
</script>
</body>
</html>
