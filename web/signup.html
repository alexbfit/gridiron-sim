<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{document.documentElement.dataset.theme=localStorage.getItem("gs_theme")||"light";if(localStorage.getItem("gs_owner")==="1")document.documentElement.classList.add("owner")}catch(e){}</script>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/ui.css">
<title>Sign up · GameTime Win</title>
<meta name="robots" content="noindex">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="assets/shell.js"></script>
</head>
<body>
<header data-shell-header></header>
<main class="page">
  <div class="auth-wrap">
    <div id="steps"></div>
    <div class="auth-card" id="box">
      <div class="skeleton" style="height:30px;width:60%"></div>
      <div class="skeleton" style="height:16px;width:90%;margin-top:14px"></div>
    </div>
  </div>
</main>
<footer data-shell-footer="site"></footer>
<script>
(async function () {
  const GS = window.GS, cfg = GS.cfg, A = GS.Account, plan = cfg.PLAN || {};
  const box = document.getElementById("box"), stepsEl = document.getElementById("steps");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const qs = new URLSearchParams(location.search);
  const nextRaw = (qs.get("next") || "").toLowerCase();
  const next = GS.MEMBER_PAGES.has(nextRaw) ? nextRaw : "";          // only pages inside the site, never an outside URL
  let mode = qs.get("mode") === "signin" ? "signin" : "signup";
  const price = `${plan.price || "$99"} a ${plan.interval || "month"}`;

  const steps = (at) => { stepsEl.innerHTML = at ? `<div class="auth-steps" aria-label="Sign-up steps">
    <span class="${at > 1 ? "done" : ""}" ${at === 1 ? 'aria-current="step"' : ""}><b>${at > 1 ? "✓" : "1"}</b>Create your account</span><i></i>
    <span ${at === 2 ? 'aria-current="step"' : ""}><b>2</b>Start your membership</span></div>` : ""; };

  await A.ready;
  const supa = A.getClient();
  if (!supa) { box.innerHTML = `<h1>Log-in is unavailable</h1><p class="lede">The log-in service didn't load. Check your connection and reload the page.</p>`; return; }
  if (qs.get("checkout") === "cancel") GS.toast("Checkout cancelled. Nothing was charged.");

  // ---------------------------------------------------------------- already logged in
  if (A.user) {
    if (A.active()) { location.replace(next || "home.html"); return; }
    return renderPay();
  }

  // ---------------------------------------------------------------- step 1: create account / log in
  const NAMES = { google: "Google", apple: "Apple", discord: "Discord", facebook: "Facebook", twitter: "X", github: "GitHub", azure: "Microsoft" };
  let enabled = {};
  try { const r = await fetch(`${cfg.SUPABASE_URL}/auth/v1/settings`, { headers: { apikey: cfg.SUPABASE_ANON_KEY } }); enabled = (await r.json()).external || {}; } catch (e) {}
  const shown = (cfg.AUTH_PROVIDERS || ["google"]).filter(p => NAMES[p] && enabled[p]);
  // where to go once the log-in completes. Kept in this browser (not in the URL) so it survives the trip to Google or to an email link.
  const remember = () => GS.store.set("gs_after_auth", JSON.stringify({ next, at: Date.now() }));
  const back = location.origin + "/account.html";

  function renderAuth() {
    const up = mode === "signup";
    steps(up ? 1 : 0);
    document.title = (up ? "Sign up" : "Log in") + " · GameTime Win";
    box.innerHTML = `<h1>${up ? "Create your account" : "Log in"}</h1>
      <p class="lede">${up ? `No password to remember. Payment is the next step: ${esc(price)}.` : "Welcome back."}</p>
      ${shown.length ? `<div class="providers">${shown.map(p => `<button type="button" class="btn" data-provider="${p}"><span class="mark">${NAMES[p][0]}</span>Continue with ${NAMES[p]}</button>`).join("")}</div><div class="or">or</div>` : `<div style="height:20px"></div>`}
      <form id="emailForm" style="display:grid;gap:12px">
        <label class="field"><span>Email</span><input class="input" type="email" id="email" required autocomplete="email" inputmode="email" value="${esc(qs.get("email") || "")}"></label>
        <button class="btn btn-primary btn-block" type="submit" id="sendBtn">Email me a log-in link</button>
      </form>
      <p class="hint" style="margin-top:16px">By continuing you agree to the <a class="link" href="terms.html">Terms</a> and <a class="link" href="privacy.html">Privacy Policy</a>. You must be of legal age to play paid contests in your state.</p>
      <p class="auth-switch">${up ? `Already a member? <a class="link" href="#" id="swap">Log in</a>` : `New here? <a class="link" href="#" id="swap">Sign up</a>`}</p>`;
    document.getElementById("swap").addEventListener("click", (e) => { e.preventDefault(); mode = up ? "signin" : "signup"; renderAuth(); });
    box.querySelectorAll("[data-provider]").forEach(b => b.addEventListener("click", async () => {
      b.disabled = true; remember();
      const { error } = await supa.auth.signInWithOAuth({ provider: b.dataset.provider, options: { redirectTo: back } });
      if (error) { GS.toast(error.message, "error"); b.disabled = false; }
    }));
    document.getElementById("emailForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("sendBtn"), email = document.getElementById("email").value.trim().toLowerCase(), label = btn.textContent;
      btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Sending`; remember();
      const { error } = await supa.auth.signInWithOtp({ email, options: { emailRedirectTo: back } });
      if (error) { GS.toast(error.message, "error"); btn.disabled = false; btn.textContent = label; return; }
      box.innerHTML = `<h1>Check your email</h1>
        <p class="lede">We sent a log-in link to <b>${esc(email)}</b>. Open it on this device. It can take a minute, and it sometimes lands in spam.</p>
        <a class="btn btn-block" style="margin-top:22px" href="signup.html${location.search}">Use a different email</a>`;
    });
  }

  // ---------------------------------------------------------------- step 2: pay
  function renderPay() {
    steps(2);
    document.title = "Start your membership · GameTime Win";
    const status = A.profile?.subscription_status;
    const lapsed = status === "past_due" || status === "unpaid";
    box.innerHTML = `<h1>${lapsed ? "Your last payment didn't go through" : "Start your membership"}</h1>
      ${lapsed ? `<p class="lede">Update your card to get back in.</p>` : `<div class="price-line"><b>${esc(plan.price || "$99")}</b><span>a ${esc(plan.interval || "month")}</span></div>
      <ul class="checklist" style="margin-top:18px">${(plan.includes || []).map(f => `<li>${GS.icon("check")}<span>${esc(f)}</span></li>`).join("")}</ul>`}
      <button class="btn btn-primary btn-lg btn-block" style="margin-top:24px" id="payBtn">${lapsed ? "Update payment details" : "Continue to payment"}</button>
      <p class="hint" style="margin-top:14px">You pay on Stripe's secure checkout page. The membership renews each month until you cancel, and you can cancel any time from your account page. See the <a class="link" href="terms.html#billing">billing terms</a>.</p>
      <p class="auth-switch">Logged in as ${esc(A.user.email)}. <a class="link" href="#" data-logout>Log out</a></p>`;
    const btn = document.getElementById("payBtn");
    btn.addEventListener("click", async () => {
      const label = btn.textContent; btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Opening checkout`;
      try { await (lapsed && A.profile?.stripe_customer_id ? A.portal() : A.checkout()); }
      catch (err) { GS.toast(err.message, "error"); btn.disabled = false; btn.textContent = label; }
    });
  }

  if (qs.get("step") === "pay") mode = "signup";
  renderAuth();
})();
</script>
</body>
</html>
