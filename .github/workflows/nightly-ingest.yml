name: nightly-ingest

on:
  schedule:
    - cron: "0 9 * * *"      # 5 AM ET daily (9:00 UTC)
  workflow_dispatch:
    inputs:
      seasons:
        description: "Space-separated seasons to (back)fill, e.g. 2023 2024 2025"
        required: false
        default: ""

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r jobs/requirements.txt
      - name: Run ingest
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.seasons }}" ]; then
            python jobs/ingest.py --seasons ${{ github.event.inputs.seasons }}
          else
            python jobs/ingest.py
          fi
